name: Build Redesign APK Fast

on:
  push:
    branches: [main]
    paths:
      - ".github/redesign-apk-request.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/netflix-reference-design
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build React TV frontend
        run: |
          npm install
          npm run build
          rm -rf android-apk/app/src/main/assets/web
          mkdir -p android-apk/app/src/main/assets/web
          cp -R dist/. android-apk/app/src/main/assets/web/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nocturne-debug-signing-v4
      - name: Install Android platform
        working-directory: android-apk
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        working-directory: android-apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Nocturne-TV-4.1.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-TV-4.1.1
          path: android-apk/app/build/outputs/apk/debug/Nocturne-TV-4.1.1.apk
          if-no-files-found: error
