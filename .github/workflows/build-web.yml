name: Build Web TV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/build-web.yml"

concurrency:
  group: nocturne-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          exit $code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Web-build-log
          path: build.log
          if-no-files-found: warn
      - name: Upload web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Web-TV
          path: dist
          if-no-files-found: error
