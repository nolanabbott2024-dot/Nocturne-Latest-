name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/apk-build-request.txt"

concurrency:
  group: nocturne-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-apk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/netflix-reference-design
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build React TV frontend
        working-directory: ${{ github.workspace }}
        run: |
          npm install
          npm run build
          rm -rf android-apk/app/src/main/assets/web
          mkdir -p android-apk/app/src/main/assets/web
          cp -R dist/. android-apk/app/src/main/assets/web/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nocturne-debug-signing-v4
      - name: Install Android platform
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native screens and playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          working-directory: android-apk
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/com.nolanabbott.nocturne/files/screenshots app/build/screenshots
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-TV-verification
          path: |
            android-apk/app/build/reports/androidTests
            android-apk/app/build/outputs/androidTest-results
            android-apk/app/build/screenshots
      - name: Rename APK
        if: ${{ always() && hashFiles('android-apk/app/build/outputs/apk/debug/app-debug.apk') != '' }}
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Nocturne-TV.apk
      - name: Upload APK
        if: ${{ always() && hashFiles('android-apk/app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-TV-APK
          path: android-apk/app/build/outputs/apk/debug/Nocturne-TV.apk
          if-no-files-found: error
