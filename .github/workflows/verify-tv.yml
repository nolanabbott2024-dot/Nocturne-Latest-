name: Verify TV Navigation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/verify-tv.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run TV tests
        shell: bash
        run: |
          set +e
          npm run test:tv 2>&1 | tee tv-test.log
          code=${PIPESTATUS[0]}
          exit $code
      - name: Upload TV test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-TV-playwright
          path: |
            playwright-report
            test-results
            tv-test.log
          if-no-files-found: ignore
