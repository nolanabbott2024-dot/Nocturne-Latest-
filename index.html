<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atrium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LIQUID GLASS DESIGN SYSTEM
   ============================================================ */
:root{
  --bg:#08080A;
  --text:#FFFFFF;
  --text2:rgba(255,255,255,0.62);
  --text3:rgba(255,255,255,0.42);

  /* glass material */
  --glass-tint:rgba(255,255,255,0.065);
  --glass-tint-hi:rgba(255,255,255,0.13);
  --glass-blur:blur(36px) saturate(200%) brightness(1.08);
  --rim-bright:rgba(255,255,255,0.52);
  --rim-dim:rgba(255,255,255,0.07);

  --pad:clamp(20px,4.2vw,80px);
  --r-card:16px;
  --ease:cubic-bezier(.2,.7,.3,1);
  --spring:cubic-bezier(.16,.9,.28,1);

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}

/* --- the material itself ------------------------------------- */
.glass{
  position:relative;isolation:isolate;
  background:var(--glass-tint);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:
    inset 0 1px 0 0 rgba(255,255,255,.26),
    inset 0 -1px 0 0 rgba(255,255,255,.05),
    0 20px 54px -14px rgba(0,0,0,.72);
  transition:background 240ms var(--ease), box-shadow 240ms var(--ease), transform 240ms var(--spring);
}
/* specular sheen — light falling across the surface */
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(147deg,
    rgba(255,255,255,.17) 0%,
    rgba(255,255,255,.03) 32%,
    transparent 55%,
    rgba(255,255,255,.055) 100%);
  mix-blend-mode:screen;
}
/* rim lensing — the refracted bright edge */
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  padding:1px;
  background:linear-gradient(153deg,
    var(--rim-bright) 0%,
    var(--rim-dim) 34%,
    transparent 52%,
    var(--rim-dim) 68%,
    rgba(255,255,255,.30) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
}
.glass.lit{
  background:var(--glass-tint-hi);
  --rim-bright:rgba(255,255,255,.85);
  --rim-dim:rgba(255,255,255,.16);
  box-shadow:
    inset 0 1px 0 0 rgba(255,255,255,.42),
    inset 0 -1px 0 0 rgba(255,255,255,.09),
    0 26px 64px -14px rgba(0,0,0,.8);
}

/* ============================================================
   BACKDROP
   ============================================================ */
/* --- spotlight trailer layer --- */
.sl-layer{position:absolute;inset:0;opacity:0;transition:opacity 900ms var(--ease);overflow:hidden}
.sl-layer.on{opacity:1}
.sl-layer video,.sl-layer iframe{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:100%;height:100%;min-width:177.78vh;min-height:56.25vw;
  border:0;object-fit:cover;pointer-events:none}
/* procedural stand-in so the motion design is visible for bundled titles */
.sl-demo{position:absolute;inset:-6%}
.sl-demo span{position:absolute;inset:0;opacity:0;
  animation:slcut 13s linear infinite;transform-origin:center}
.sl-demo span:nth-child(1){animation-delay:0s}
.sl-demo span:nth-child(2){animation-delay:3.25s}
.sl-demo span:nth-child(3){animation-delay:6.5s}
.sl-demo span:nth-child(4){animation-delay:9.75s}
@keyframes slcut{
  0%{opacity:0;transform:scale(1.02) translate3d(0,0,0)}
  4%{opacity:1}
  21%{opacity:1;transform:scale(1.14) translate3d(-2.5%,1.5%,0)}
  25%{opacity:0;transform:scale(1.16) translate3d(-3%,2%,0)}
  100%{opacity:0}
}
.sl-audio{position:absolute;right:var(--pad);bottom:clamp(30px,5vh,58px);z-index:6}
@media(prefers-reduced-motion:reduce){.sl-demo span{animation:none;opacity:.6}}

#backdrop{position:fixed;inset:0;z-index:0;background:var(--bg)}
.bd-layer{position:absolute;inset:0;opacity:0;transition:opacity 950ms var(--ease);transform-origin:62% 38%}
.bd-layer.on{opacity:1;animation:kb 28s linear infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
.bd-grain{position:absolute;inset:0;pointer-events:none;opacity:.42;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.2'/></svg>")}
#scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(to top,rgba(0,0,0,1) 0%,rgba(0,0,0,.94) 18%,rgba(0,0,0,.60) 45%,rgba(0,0,0,.12) 78%,rgba(0,0,0,.34) 100%),
    linear-gradient(to right,rgba(0,0,0,.80) 0%,rgba(0,0,0,.30) 42%,rgba(0,0,0,0) 72%)}
body.in-detail #scrim{background:
  linear-gradient(to top,rgba(0,0,0,1) 0%,rgba(0,0,0,.92) 30%,rgba(0,0,0,.62) 62%,rgba(0,0,0,.30) 100%),
  linear-gradient(to right,rgba(0,0,0,.88) 0%,rgba(0,0,0,.44) 48%,rgba(0,0,0,.05) 82%)}
#dim{position:fixed;inset:0;z-index:2;background:#000;opacity:0;pointer-events:none;transition:opacity 280ms var(--ease)}
body.sidebar-open #dim{opacity:.42}

#app{position:relative;z-index:3;height:100%;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.page[hidden]{display:none}

/* ============================================================
   TOP NAV
   ============================================================ */
#topbar{
  position:fixed;z-index:20;
  top:calc(env(safe-area-inset-top,0px) + clamp(12px,2.2vh,26px));
  left:var(--pad);right:var(--pad);
  display:flex;align-items:center;gap:12px;
  transition:opacity 280ms var(--ease),transform 340ms var(--spring);
}
body.sidebar-open #topbar,body.playing #topbar{
  opacity:0;transform:translateY(-16px) scale(.97);pointer-events:none}
.tabbar{
  display:flex;align-items:center;gap:3px;
  padding:5px;border-radius:999px;max-width:100%;overflow-x:auto}
.tab{
  padding:9px clamp(16px,1.6vw,26px);border-radius:999px;white-space:nowrap;
  font-size:clamp(14px,1.05vw,18px);font-weight:500;letter-spacing:.004em;
  transition:background 200ms var(--ease),color 200ms var(--ease),transform 220ms var(--spring)}
.tab[aria-current="true"]{
  background:rgba(255,255,255,.19);font-weight:560;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.46),inset 0 0 0 .5px rgba(255,255,255,.2),
    0 4px 16px rgba(0,0,0,.34)}
.tab.focused{
  background:rgba(255,255,255,.95);color:#0A0A0A;font-weight:600;transform:scale(1.04);
  box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.9)}
.topright{margin-left:auto;display:flex;align-items:center;gap:9px;flex:none}
.iconbtn{
  width:clamp(40px,2.85vw,50px);height:clamp(40px,2.85vw,50px);border-radius:999px;
  display:grid;place-items:center;font-size:clamp(15px,1.1vw,19px);
  transition:background 200ms var(--ease),color 200ms var(--ease),transform 220ms var(--spring)}
.iconbtn.focused{background:rgba(255,255,255,.95);color:#0A0A0A;transform:scale(1.09)}
.nav-chev{color:var(--text3);font-size:20px;padding:0 2px}

/* ============================================================
   SIDEBAR  (glass panel, morphs in)
   ============================================================ */
#sidebar{
  position:fixed;z-index:30;
  top:calc(env(safe-area-inset-top,0px) + 16px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  left:16px;width:clamp(240px,19vw,290px);
  border-radius:26px;padding:20px 12px;
  display:flex;flex-direction:column;gap:1px;overflow-y:auto;
  transform:translateX(calc(-100% - 24px)) scale(.97);
  opacity:0;
  transition:transform 340ms var(--spring),opacity 220ms var(--ease);
}
body.sidebar-open #sidebar{transform:none;opacity:1}
.sb-profile{display:flex;align-items:center;gap:11px;padding:4px 12px 18px}
.sb-avatar{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;
  font-size:13px;font-weight:600;color:#2A1018;
  background:linear-gradient(145deg,#F0AEBF,#B96A8C);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.sb-name{font-size:15px;font-weight:500}
.sb-time{margin-left:auto;font-size:13px;color:var(--text3);font-variant-numeric:tabular-nums}
.sb-head{padding:20px 14px 7px;font-size:12.5px;color:var(--text3);font-weight:500}
.sb-item{display:flex;align-items:center;gap:13px;width:100%;padding:10px 14px;border-radius:999px;
  font-size:15px;text-align:left;transition:all 200ms var(--ease);position:relative;isolation:isolate}
.sb-item .ic{width:19px;text-align:center;font-size:15px;opacity:.9;flex:none}
.sb-item[aria-current="true"]{
  background:rgba(255,255,255,.17);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 .5px rgba(255,255,255,.2),0 4px 16px rgba(0,0,0,.35);
  font-weight:560}
.sb-item.focused{background:rgba(255,255,255,.92);color:#0A0A0A;font-weight:600;
  box-shadow:0 8px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.9)}

/* ============================================================
   HERO
   ============================================================ */
.hero{height:min(72vh,calc(100vh - 210px));min-height:380px;padding:0 var(--pad);
  display:flex;flex-direction:column;justify-content:flex-end}
.hero-inner{max-width:min(620px,52vw);padding-bottom:clamp(30px,5vh,58px)}
.hero-fade{animation:heroIn 720ms var(--ease) both}
@keyframes heroIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero-title{font-size:clamp(40px,6.4vw,80px);font-weight:600;line-height:.96;margin:0 0 16px;
  letter-spacing:.14em;text-indent:.14em;text-shadow:0 4px 44px rgba(0,0,0,.65)}
.hero-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px;
  font-size:clamp(13px,1.05vw,18px);color:rgba(255,255,255,.88);font-weight:500}
.dot{color:var(--text3)}
.badge{border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:1px 6px;
  font-size:.74em;letter-spacing:.04em;color:rgba(255,255,255,.8)}
.svc{width:1.4em;height:1.4em;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:.56em;font-weight:700;background:linear-gradient(140deg,#7A8798,#2C333D);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.hero-desc{font-size:clamp(14px,1.08vw,19px);line-height:1.45;color:rgba(255,255,255,.82);
  margin:0 0 14px;max-width:34em}
.hero-tag{font-size:clamp(13px,1vw,17px);font-weight:500;margin-bottom:22px}
.hero-actions{display:flex;align-items:center;gap:13px}
.btn-play{display:flex;align-items:center;gap:9px;background:#fff;color:#0A0A0A;border-radius:999px;
  padding:13px 30px 13px 24px;font-size:clamp(15px,1.1vw,19px);font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform 220ms var(--spring),box-shadow 220ms var(--ease)}
.btn-play.focused{transform:scale(1.055);box-shadow:0 18px 44px rgba(0,0,0,.6),0 0 0 4px rgba(255,255,255,.28)}
.btn-round{width:clamp(44px,3.1vw,54px);height:clamp(44px,3.1vw,54px);border-radius:999px;
  display:grid;place-items:center;font-size:clamp(15px,1.15vw,20px)}
.btn-round.focused{transform:scale(1.09)}
.btn-round.on{background:rgba(255,255,255,.9);color:#0A0A0A}
.hero-dots{display:flex;justify-content:center;gap:7px;padding-bottom:clamp(10px,1.6vh,20px)}
.hdot{width:7px;height:7px;border-radius:999px;background:rgba(255,255,255,.26);
  transition:all 340ms var(--spring);box-shadow:inset 0 .5px 0 rgba(255,255,255,.4)}
.hdot.on{width:24px;background:rgba(255,255,255,.94)}

/* ============================================================
   RAILS / CARDS
   ============================================================ */
.rails{padding-bottom:clamp(40px,7vh,90px)}
.rail{margin-bottom:clamp(24px,3.4vh,42px)}
.rail-head{padding:0 var(--pad);margin:0 0 13px;font-size:clamp(17px,1.65vw,30px);
  font-weight:600;letter-spacing:-.014em}
.rail-scroll{display:flex;gap:clamp(10px,.95vw,20px);padding:14px var(--pad) 8px;
  overflow-x:auto;overflow-y:visible;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.card{flex:none;position:relative;text-align:left;transform-origin:center;
  transition:transform 230ms var(--spring),filter 230ms var(--ease)}
.card .thumb{border-radius:var(--r-card);overflow:hidden;position:relative;background:#141418;
  box-shadow:0 2px 14px rgba(0,0,0,.45);transition:box-shadow 230ms var(--ease)}
.card.poster{width:clamp(108px,10.2vw,190px)}
.card.poster .thumb{aspect-ratio:2/3}
.card.land{width:clamp(180px,17.5vw,330px)}
.card.land .thumb{aspect-ratio:16/9}
.card.square{width:clamp(130px,12vw,210px)}
.card.square .thumb{aspect-ratio:1/1}
.card.focused{transform:scale(1.075);filter:brightness(1.1);z-index:5}
/* glass rim lensing on the focused card */
.card.focused .thumb{box-shadow:0 26px 52px rgba(0,0,0,.75)}
.card .thumb::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  padding:1.5px;opacity:0;transition:opacity 230ms var(--ease);
  background:linear-gradient(153deg,rgba(255,255,255,.95),rgba(255,255,255,.2) 36%,rgba(255,255,255,.08) 58%,rgba(255,255,255,.65));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;z-index:4}
.card.focused .thumb::after{opacity:1}
.art{position:absolute;inset:0}
.art::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.18) 48%,transparent 72%)}
.art-name{position:absolute;left:9%;right:9%;bottom:10%;z-index:2;text-align:center;
  font-size:clamp(10px,.86vw,16px);font-weight:700;line-height:1.08;letter-spacing:.06em;
  text-shadow:0 2px 12px rgba(0,0,0,.85)}
.rank{position:absolute;left:-2px;bottom:-4px;z-index:3;font-size:clamp(30px,3.4vw,62px);
  font-weight:700;line-height:.8;-webkit-text-stroke:2px rgba(0,0,0,.55)}
.prog{position:absolute;left:0;right:0;bottom:0;height:3.5px;background:rgba(255,255,255,.22);z-index:3}
.prog i{display:block;height:100%;background:#fff}
.cap{padding:9px 2px 0;opacity:0;transition:opacity 210ms var(--ease)}
.card.focused .cap,.rail.always-cap .cap{opacity:1}
.cap-t{font-size:clamp(12px,.92vw,16px);font-weight:500;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-s{font-size:clamp(11px,.8vw,14px);color:var(--text3);margin-top:2px}
.rail.ranked .rail-scroll{padding-left:calc(var(--pad) + 14px)}

/* ============================================================
   DETAIL
   ============================================================ */
.detail-hero{padding:clamp(90px,15vh,180px) var(--pad) 0;min-height:82vh;
  display:flex;flex-direction:column;justify-content:flex-end}
.detail-inner{max-width:min(640px,54vw);padding-bottom:clamp(30px,5vh,56px)}
.d-title{font-size:clamp(34px,5vw,68px);font-weight:700;letter-spacing:-.025em;line-height:1;margin:0 0 15px}
.d-desc{font-size:clamp(14px,1.05vw,18px);line-height:1.5;color:rgba(255,255,255,.8);margin:0 0 16px;max-width:36em}
.d-credits{font-size:clamp(12.5px,.95vw,16px);color:var(--text3);line-height:1.65;margin-bottom:24px}
.d-credits b{color:var(--text2);font-weight:500}
.seasons{display:flex;gap:9px;padding:0 var(--pad) 18px;flex-wrap:wrap}
.chip{padding:8px 19px;border-radius:999px;font-size:clamp(13px,1vw,16px);font-weight:500}
.chip[aria-selected="true"]{background:rgba(255,255,255,.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 .5px rgba(255,255,255,.22)}
.chip.focused{background:rgba(255,255,255,.93);color:#0A0A0A;font-weight:600;transform:scale(1.05)}
.eps{padding:0 var(--pad) 90px;display:grid;gap:10px}
.ep{display:flex;gap:16px;align-items:center;width:100%;text-align:left;padding:11px;border-radius:18px}
.ep.focused{transform:scale(1.012)}
.ep-thumb{width:clamp(110px,13vw,208px);aspect-ratio:16/9;border-radius:11px;overflow:hidden;
  position:relative;flex:none;background:#141418}
.ep-body{min-width:0;flex:1}
.ep-t{font-size:clamp(14px,1.05vw,18px);font-weight:560;margin-bottom:4px}
.ep-d{font-size:clamp(12.5px,.92vw,15px);color:var(--text3);line-height:1.42;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-m{font-size:clamp(12px,.88vw,14px);color:var(--text3);margin-top:6px}
.tick{margin-left:8px}

/* ============================================================
   GENERIC PAGES
   ============================================================ */
.pagehead{padding:clamp(80px,13vh,150px) var(--pad) 22px}
.pagehead h1{font-size:clamp(32px,4.2vw,62px);font-weight:700;letter-spacing:-.028em;margin:0}
.filters{display:flex;gap:9px;padding:0 var(--pad) 26px;flex-wrap:wrap}
.searchfield{margin:0 var(--pad) 8px;padding:16px 24px;border-radius:20px;display:flex;
  align-items:center;gap:14px;font-size:clamp(16px,1.5vw,26px);color:var(--text3)}
.searchfield input{flex:1;background:none;border:0;outline:none;color:#fff;font:inherit;min-width:0}
.searchfield input::placeholder{color:var(--text3)}
.grid{display:grid;gap:clamp(12px,1.1vw,22px);padding:0 var(--pad) 90px;
  grid-template-columns:repeat(auto-fill,minmax(clamp(108px,10vw,180px),1fr))}
.grid .card{width:100%}
.empty{padding:0 var(--pad);color:var(--text3);font-size:clamp(14px,1.1vw,18px);max-width:34em;line-height:1.55}
.empty b{display:block;color:#fff;font-weight:560;font-size:1.15em;margin-bottom:7px}
.sets{padding:0 var(--pad) 90px;display:grid;gap:6px;max-width:940px}
.sechead{padding:26px var(--pad) 8px;font-size:clamp(15px,1.25vw,20px);font-weight:600;color:var(--text2)}
.setrow{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:15px 20px;border-radius:16px}
.setrow.focused{transform:scale(1.008)}
.setrow .lbl{flex:1;font-size:clamp(14px,1.05vw,17px)}
.setrow .sub{display:block;font-size:clamp(12px,.9vw,14px);color:var(--text3);margin-top:3px}
.setrow .val{font-size:clamp(13px,1vw,16px);color:var(--text2)}
.addon{display:flex;gap:16px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:20px}
.addon.focused{transform:scale(1.008)}
.addon .ai{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.addon .ab{flex:1;min-width:0}
.addon .an{font-size:clamp(14px,1.05vw,17px);font-weight:560}
.addon .au{font-size:11.5px;color:var(--text3);margin-top:2px;font-variant-numeric:tabular-nums}
.addon .ad{font-size:clamp(12px,.9vw,14.5px);color:var(--text3);margin-top:4px;line-height:1.4}
.caps{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.capt{font-size:11.5px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--text2)}
.pillbtn{padding:9px 20px;border-radius:999px;font-size:14px;font-weight:560;flex:none;
  background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.pillbtn.done{background:transparent;color:var(--text3);box-shadow:none}

/* --- addon install + async states --- */

  setStorage(k, v){ try{ localStorage.setItem("atrium:"+k, JSON.stringify(v)); }catch(e){} },

  async fetchJSON(url, ms=12000){
    let host=url;
    try{ host=new URL(url).host; }catch(e){ throw new AddonError("url","That doesn't look like a valid URL."); }
    if(location.protocol==="https:" && /^http:\/\//i.test(url))
      throw new AddonError("mixed",`This page is served over HTTPS, so the browser blocks plain HTTP add-ons. Use an https:// URL for ${host}.`);

      /* No custom headers on purpose: any header beyond the CORS-safelist turns
         this into a preflighted request, and plenty of add-on servers set
         Access-Control-Allow-Origin on GET but never answer the OPTIONS. */
      const r = await fetch(url, {signal:c.signal, mode:"cors", credentials:"omit"});
      if(!r.ok) throw new AddonError("http", `${host} responded ${r.status}.`);
      return await r.json();
    }catch(e){
      if(e instanceof AddonError) throw e;
      if(e.name==="AbortError") throw new AddonError("timeout",`${host} didn't respond within ${ms/1000}s.`);
      if(e instanceof SyntaxError) throw new AddonError("parse",`${host} answered, but not with JSON.`);

    }finally{ clearTimeout(t); }

};
class AddonError extends Error{ constructor(kind,msg){ super(msg||kind); this.kind=kind; } }

/* ================================================================
   ADDON PROTOCOL  —  src/addon_transport/http_transport
   Resource URL, per http_transport.rs:48-67
     no extra : {base}/{resource}/{type}/{id}.json
     with extra: {base}/{resource}/{type}/{id}/{k=v&k=v}.json
   All components percent-encoded (URI_COMPONENT_ENCODE_SET).
   ================================================================ */
const ADDON_MANIFEST_PATH = "/manifest.json";
const ADDON_LEGACY_PATH   = "/-/q.json";
const queryParamsEncode = extra =>
  extra.map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join("&");

class AddonHTTPTransport{
  constructor(transportUrl){ this.transportUrl = transportUrl; }
  resourceUrl(path){
    if(this.transportUrl.endsWith(ADDON_LEGACY_PATH))
      throw new AddonError("legacy","This is a legacy (v1) add-on. Only the v2 protocol is supported.");
    if(!this.transportUrl.endsWith(ADDON_MANIFEST_PATH))
      throw new AddonError("url",`Transport URL must end with ${ADDON_MANIFEST_PATH}`);
    const e = encodeURIComponent;
    const seg = (path.extra && path.extra.length)
      ? `/${e(path.resource)}/${e(path.type)}/${e(path.id)}/${queryParamsEncode(path.extra)}.json`
      : `/${e(path.resource)}/${e(path.type)}/${e(path.id)}.json`;
    return this.transportUrl.replace(ADDON_MANIFEST_PATH, seg);
  }
  manifest(){ return Env.fetchJSON(this.transportUrl); }
  resource(path){ return Env.fetchJSON(this.resourceUrl(path)); }
}

/* manifest resource matching — types/addon/manifest.rs ManifestResource */
function manifestResource(manifest, name){
  const list = manifest.resources || [];
  const r = list.find(x => typeof x === "string" ? x === name : x && x.name === name);
  if(!r) return null;
  return typeof r === "string"
    ? {name:r, types:manifest.types||[], idPrefixes:manifest.idPrefixes||null}
    : {name:r.name, types:r.types||manifest.types||[], idPrefixes:r.idPrefixes||manifest.idPrefixes||null};
}
function isSupported(manifest, resource, type, id){
  const r = manifestResource(manifest, resource);
  if(!r) return false;
  if(r.types.length && type && !r.types.includes(type)) return false;
  if(r.idPrefixes && id && !r.idPrefixes.some(p=>String(id).startsWith(p))) return false;
  return true;
}

  if(!m || typeof m!=="object") throw new AddonError("manifest","That URL didn't return an add-on manifest.");

  if(!Array.isArray(m.resources)||!m.resources.length)
    throw new AddonError("manifest","Manifest declares no resources.");
  if(!Array.isArray(m.types)) m.types = [];

const Addons = {
  transport(d){ return d.builtin ? new DemoTransport() : new AddonHTTPTransport(d.transportUrl); },
  installed(){ return model.ctx.profile.addons; },
  /* a resource is live only if the manifest declares it AND the user left it on */
  enabled(d,resource){ return !d.enabled || d.enabled[resource]!==false; },
  supporting(resource, type, id){
    return this.installed().filter(d=>
      this.enabled(d,resource) && isSupported(d.manifest, resource, type, id));
  },
  async install(url){
    url = url.trim();
    if(!/^https?:\/\//i.test(url)) url = url.replace(/^stremio:\/\//i,"https://");
    if(!url.endsWith(ADDON_MANIFEST_PATH))
      url = url.replace(/\/+$/,"") + ADDON_MANIFEST_PATH;
    if(this.installed().some(d=>d.transportUrl===url))
      throw new AddonError("dupe","That add-on is already installed.");
    const manifest = validateManifest(await new AddonHTTPTransport(url).manifest());
    const descriptor = {transportUrl:url, manifest, flags:{official:false},
      enabled:Object.fromEntries((manifest.resources||[])
        .map(r=>[typeof r==="string"?r:r.name,true]))};
    dispatch(["Ctx","InstallAddon",descriptor]);
    return descriptor;
  },
  /* first addon that returns a meta wins — core's MetaDetails behaviour */
  async meta(type, id){
    const base = String(id).split(":")[0];
    for(const d of this.supporting("meta", type, base)){
      try{
        const r = await this.transport(d).resource({resource:"meta",type,id:base,extra:[]});
        if(r && r.meta) return {meta:cacheMeta(normalizeMeta(r.meta),d.transportUrl), addon:d};
      }catch(e){ /* try the next addon */ }
    }
    return {meta:null, addon:null};
  },
  /* streams aggregate across every addon that supports the id */
  async streams(type, id){
    const ds = this.supporting("stream", type, id);
    const results = await Promise.allSettled(
      ds.map(d=>this.transport(d).resource({resource:"stream",type,id,extra:[]})));
    const out=[], failed=[];
    results.forEach((r,i)=>{
      if(r.status==="rejected"){ failed.push({addon:ds[i], error:r.reason}); return; }
      (r.value.streams||[]).forEach(s=>out.push(Object.assign({}, s, {_addon:ds[i]})));
    });
    return {streams:out, failed};
  },
  async subtitles(type, id){
    const ds = this.supporting("subtitles", type, id);
    const r = await Promise.allSettled(
      ds.map(d=>this.transport(d).resource({resource:"subtitles",type,id,extra:[]})));
    return r.flatMap(x=>x.status==="fulfilled" ? (x.value.subtitles||[]) : []);
  },
  /* the bundled Cinemeta manifest is a starting point; correct it from the live
     endpoint in the background so its catalogs stay accurate over time */
  async refreshManifests(){
    await Promise.allSettled(this.installed().filter(d=>!d.builtin).map(async d=>{
      try{
        const m=validateManifest(await this.transport(d).manifest());
        if(JSON.stringify(m)!==JSON.stringify(d.manifest)){
          d.manifest=m; catalogCacheDrop(d.transportUrl); heroPool=[]; persist();
        }
      }catch(e){ /* offline or blocked — keep the bundled manifest */ }
    }));
  },
  async catalog(d, type, catalogId, extra){
    const key=ckey(d,type,catalogId,extra), hit=catalogCache.get(key), now=Date.now();
    const isCinemeta=d.transportUrl===CINEMETA_DESC.transportUrl;
    const hydrate=async metas=>{
      if(!isCinemeta) return metas;
      const small=metas.slice(0,6);
      await Promise.allSettled(small.map(m=>ensureTrailer(m)));
      return small;
    };
    const fetchFresh=async()=>{
      const r=await this.transport(d).resource({resource:"catalog",type,id:catalogId,extra:extra||[]});
      const metas=await hydrate((r.metas||[]).map(m=>cacheMeta(normalizeMeta(m),d.transportUrl)));
      catalogCache.set(key,{t:Date.now(),metas});
      catalogCachePersist();
      return metas;
    };
    if(hit){
      /* serve what we have immediately; refresh behind the user if it's aged out */
      if(now-hit.t>CATALOG_TTL) fetchFresh().catch(()=>{});
      return hydrate(hit.metas.map(m=>cacheMeta(normalizeMeta(m),d.transportUrl)));
    }
    return fetchFresh();
  },
  /* every catalog across installed addons that needs no required extra.
     all=true returns them unfiltered, for the catalog preferences page */
  boardCatalogs(all){
    const out=[];
    this.installed().forEach(d=>{
      if(!this.enabled(d,"catalog")) return;
      (d.manifest.catalogs||[]).forEach(c=>{
        const required=(c.extra||[]).filter(e=>e.isRequired||e.is_required);
        if(required.length) return;
        if((c.extraRequired||[]).length) return;
        out.push({descriptor:d, type:c.type, id:c.id, name:c.name||c.id});
      });
    });
    const C=cp();
    out.forEach(c=>{ const k=catKey(c); if(C.names[k]) c.name=C.names[k]; });
    if(C.order&&C.order.length){
      const pos=k=>{const i=C.order.indexOf(k);return i<0?999:i;};
      out.sort((a,b)=>pos(catKey(a))-pos(catKey(b)));
    }
    return all ? out : out.filter(c=>C.hidden[catKey(c)]!==true);
  }
};
function normalizeMeta(m){
  if(!m) return m;
  if(!m.pal) m.pal = PAL[Object.keys(PAL)[(String(m.id||"").length + (m.name||"").length) % 10]];
  if(!m.links) m.links = [
    ...(m.genres||[]).map(g=>L(g,"Genres")),
    ...(m.cast||[]).map(c=>L(c,"Cast")),
    ...(m.director?[m.director].flat():[]).map(d=>L(d,"Directors"))];
  if(!m.behaviorHints) m.behaviorHints={};
  if(!m.videos) m.videos=[];
  if(!m.posterShape) m.posterShape="poster";
  return m;
}

/* ----------------------------------------------------------------
   StreamSource — src/types/resource/stream.rs
   Implemented: Url, YouTube, External, PlayerFrame.
   infoHash (Torrent) is recognised and reported, not resolved.
   ---------------------------------------------------------------- */
function streamSource(s){
  if(s.url) return {type:"Url", url:s.url, playable:true};
  if(s.ytId) return {type:"YouTube", ytId:s.ytId, playable:true};
  if(s.playerFrameUrl) return {type:"PlayerFrame", url:s.playerFrameUrl, playable:true};
  if(s.externalUrl) return {type:"External", url:s.externalUrl, playable:true, external:true};
  if(s.infoHash) return {type:"Torrent", infoHash:s.infoHash, playable:false};
  return {type:"Unknown", playable:false};
}
/* ----------------------------------------------------------------
   STREAM PIPELINE
   parse → filter → dedupe → sort (user-ordered keys) → limit → format
   Operates on whatever streams installed add-ons return.
   ---------------------------------------------------------------- */
const RES_RE=/\b(2160p|4k|uhd|1080p|720p|480p|360p)\b/i;
const HDR_RE=/\b(dolby[\s.]?vision|dovi|hdr10\+|hdr10|hlg|hdr)\b/i;
const COD_RE=/\b(hevc|h\.?265|x265|av1|h\.?264|x264|avc|vp9|mpeg-?2|xvid)\b/i;
const AUD_RE=/\b(atmos|truehd|dts[-\s.]?hd[-\s.]?ma|dts[-\s.]?hd|dts[-\s.]?x|dts|e-?ac-?3|ddp?5\.1|ac-?3|7\.1|5\.1|2\.0|stereo|flac|aac|opus|mp3)\b/i;
const QUA_RE=/\b(remux|bluray|blu-ray|bdrip|brrip|web-?dl|web-?rip|webdl|web|hdtv|dvdrip|dvd|hdrip|screener|scr|telesync|ts|cam)\b/i;
const LANG_RE=/\b(multi|dual[\s.]?audio|english|eng|spanish|spa|french|fre|fra|german|ger|deu|italian|ita|japanese|jpn|korean|kor|portuguese|por|russian|rus|hindi|hin|dubbed|subbed)\b/ig;

const RES_ORDER=["2160p","1080p","720p","480p","360p","unknown"];
const QUA_ORDER=["Remux","BluRay","WEB-DL","WEBRip","HDTV","DVD","HDRip","Screener","CAM","unknown"];
const COD_ORDER=["AV1","HEVC","H.264","VP9","MPEG-2","XviD","unknown"];
const AUD_ORDER=["Atmos","TrueHD","DTS-HD","DTS","EAC3","AC3","7.1","5.1","FLAC","AAC","Opus","Stereo","unknown"];
const rank=(arr,v)=>{const i=arr.indexOf(v);return i<0?-1:arr.length-i;};

const normRes=v=>!v?"unknown":/4k|uhd/i.test(v)?"2160p":v.toLowerCase();
const normQua=v=>{if(!v)return "unknown";const s=v.toLowerCase().replace(/[-.\s]/g,"");
  if(s==="remux")return "Remux"; if(s.startsWith("blu")||s==="bdrip"||s==="brrip")return "BluRay";
  if(s.startsWith("webdl")||s==="web")return "WEB-DL"; if(s.startsWith("webrip"))return "WEBRip";
  if(s==="hdtv")return "HDTV"; if(s.startsWith("dvd"))return "DVD"; if(s==="hdrip")return "HDRip";
  if(s==="screener"||s==="scr")return "Screener"; if(s==="cam"||s==="ts"||s==="telesync")return "CAM";
  return "unknown";};
const normCod=v=>{if(!v)return "unknown";const s=v.toLowerCase().replace(/[.\s]/g,"");
  if(s==="av1")return "AV1"; if(/hevc|h265|x265/.test(s))return "HEVC";
  if(/h264|x264|avc/.test(s))return "H.264"; if(s==="vp9")return "VP9";
  if(/mpeg2/.test(s))return "MPEG-2"; if(s==="xvid")return "XviD"; return "unknown";};
const normAud=v=>{if(!v)return "unknown";const s=v.toLowerCase().replace(/[-.\s]/g,"");
  if(s==="atmos")return "Atmos"; if(s==="truehd")return "TrueHD";
  if(s.startsWith("dtshd")||s==="dtsx")return "DTS-HD"; if(s==="dts")return "DTS";
  if(/^e?ac3$/.test(s)||s.startsWith("ddp"))return s.startsWith("e")||s.startsWith("ddp")?"EAC3":"AC3";
  if(s==="71")return "7.1"; if(s==="51")return "5.1"; if(s==="flac")return "FLAC";
  if(s==="aac")return "AAC"; if(s==="opus")return "Opus";
  if(s==="20"||s==="stereo")return "Stereo"; return "unknown";};

function parseStream(s){
  if(s._p) return s._p;
  const text=[s.name,s.title,s.description,s.behaviorHints&&s.behaviorHints.filename]
    .filter(Boolean).join(" ");
  const g=re=>{const m=text.match(re);return m?m[1]:null;};
  const langs=[...new Set((text.match(LANG_RE)||[]).map(x=>x.toLowerCase()))];
  const demo=s._demo;
  const p={
    res: demo?demo.res:normRes(g(RES_RE)),
    quality: demo?"WEB-DL":normQua(g(QUA_RE)),
    codec: demo?normCod(demo.codec):normCod(g(COD_RE)),
    hdr: demo?demo.hdr:g(HDR_RE),
    audio: demo?normAud(demo.audio):normAud(g(AUD_RE)),
    size: (s.behaviorHints&&s.behaviorHints.videoSize)||(demo&&demo.size)||null,
    langs,
    cached: demo?demo.state==="instant":false,
    filename: (s.behaviorHints&&s.behaviorHints.filename)||"",
    addon: s._addon,
    text
  };
  p.state = p.cached?"instant":"available";
  Object.defineProperty(s,"_p",{value:p,enumerable:false});
  return p;
}
const describeStream=s=>parseStream(s);   /* player still calls this */

const onAll=arr=>Object.fromEntries(arr.map(k=>[k,true]));
const DEFAULT_STREAM_PREFS={
  sort:["cached","resolution","quality","size","addon"],

  codecs:onAll(COD_ORDER),

const SORT_KEYS={
  cached:    {label:"Cached first",   cmp:(a,b)=>(b.cached?1:0)-(a.cached?1:0)},
  resolution:{label:"Resolution",     cmp:(a,b)=>rank(RES_ORDER,b.res)-rank(RES_ORDER,a.res)},
  quality:   {label:"Quality",        cmp:(a,b)=>rank(QUA_ORDER,b.quality)-rank(QUA_ORDER,a.quality)},
  hdr:       {label:"HDR first",      cmp:(a,b)=>(b.hdr?1:0)-(a.hdr?1:0)},
  codec:     {label:"Codec",          cmp:(a,b)=>rank(COD_ORDER,b.codec)-rank(COD_ORDER,a.codec)},
  audio:     {label:"Audio",          cmp:(a,b)=>rank(AUD_ORDER,b.audio)-rank(AUD_ORDER,a.audio)},
  size:      {label:"Size, largest",  cmp:(a,b)=>(b.size||0)-(a.size||0)},
  sizeAsc:   {label:"Size, smallest", cmp:(a,b)=>(a.size||Infinity)-(b.size||Infinity)},
  addon:     {label:"Add-on order",   cmp:(a,b)=>addonIndex(a)-addonIndex(b)},
  language:  {label:"Preferred language", cmp:(a,b)=>langHit(b)-langHit(a)}
};
function addonIndex(p){
  const i=model.ctx.profile.addons.findIndex(d=>p.addon&&d.transportUrl===p.addon.transportUrl);
  return i<0?99:i;
}
function langHit(p){
  const want=(model.ctx.profile.settings.subtitlesLanguage||"eng").slice(0,3);
  return p.langs.some(l=>l.startsWith(want.slice(0,3))||l==="multi"||l==="dual audio")?1:0;
}
const sp=()=>Object.assign({},DEFAULT_STREAM_PREFS,model.ctx.profile.settings.streams||{});

function applyStreamPipeline(streams){
  const P=sp(), S=model.ctx.profile.settings;
  let list=streams.map(s=>({s,p:parseStream(s)}));

  /* -- filter -- */
  const kw=(P.excludeKeywords||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);
  const capGB=parseFloat(S.maxSize), minGB=parseFloat(P.minSizeGB)||0;
  list=list.filter(({p})=>{
    if(P.resolutions[p.res]===false) return false;
    if(P.qualities[p.quality]===false) return false;
    if(P.codecs[p.codec]===false) return false;
    if(P.audio[p.audio]===false) return false;
    if(kw.length && kw.some(k=>p.text.toLowerCase().includes(k))) return false;
    if(p.size){
      if(!isNaN(capGB) && p.size/1e9>capGB) return false;
      if(minGB && p.size/1e9<minGB) return false;
    }
    return true;
  });

  /* -- dedupe: same release from several add-ons collapses to one -- */
  if(P.dedupe){
    const seen=new Map();
    list.forEach(item=>{
      const {p}=item;
      const key=(p.filename||"").toLowerCase().replace(/[^a-z0-9]/g,"")
        || [p.res,p.quality,p.codec,p.audio,p.size].join("|");
      const prev=seen.get(key);
      if(!prev) seen.set(key,Object.assign(item,{dupes:1}));
      else prev.dupes++;
    });
    list=[...seen.values()];
  }

  /* -- sort: pinned quality first, then the user's key order -- */
  const keys=(P.sort||[]).filter(k=>SORT_KEYS[k]);
  const pin=S.preferredQuality!=="Auto"?S.preferredQuality.replace("4K","2160p"):null;
  list.sort((A,B)=>{
    if(pin){
      const d=(B.p.res===pin?1:0)-(A.p.res===pin?1:0);
      if(d) return d;
    }
    for(const k of keys){ const d=SORT_KEYS[k].cmp(A.p,B.p); if(d) return d; }
    return 0;
  });

  /* -- cap per resolution -- */
  const lim=+P.perResolutionLimit||0;
  if(lim>0){
    const count={};
    list=list.filter(({p})=>{count[p.res]=(count[p.res]||0)+1;return count[p.res]<=lim;});
  }
  return list;
}
function formatStream(item,tpl){
  const {p}=item;
  const tok={
    addon:(p.addon&&p.addon.manifest.name)||item.s.name||"Source",
    title:(item.s.title||"").split("\n")[0]||"",
    resolution:p.res==="unknown"?"":p.res,
    quality:p.quality==="unknown"?"":p.quality,
    codec:p.codec==="unknown"?"":p.codec,
    audio:p.audio==="unknown"?"":p.audio,
    hdr:p.hdr||"",
    size:p.size?gb(p.size):"",
    lang:p.langs.slice(0,2).join("/"),
    filename:p.filename,
    count:item.dupes>1?`×${item.dupes}`:""
  };
  return tpl.replace(/\{(\w+)\}/g,(_,k)=>tok[k]!==undefined?tok[k]:"")
            .replace(/\s{2,}/g," ").replace(/^[\s·-]+|[\s·-]+$/g,"").trim();
}
const gb=b=>b?(b/1e9).toFixed(1)+" GB":"";
const availabilityLabel=s=>s==="instant"?"Instant":s==="available"?"Available":s==="preparing"?"Preparing":"Unavailable";

  Env.setStorage("streams",model.ctx.streams.items);
  Env.setStorage("searchHistory",model.ctx.searchHistory.items);
}
function libraryItemFrom(m){
  return {_id:m.id,name:m.name,type:m.type,poster:m.poster,posterShape:m.posterShape,
    removed:false,temp:false,_ctime:Env.now(),_mtime:Env.now(),
    state:{lastWatched:null,timeWatched:0,timeOffset:0,overallTimeWatched:0,timesWatched:0,
      flaggedWatched:0,duration:0,video_id:null,watched:null,noNotif:false}};
}
const libItem=id=>model.ctx.library.items[id];
const inLibrary=id=>{const i=libItem(id);return !!i&&!i.removed&&!i.temp;};

/* meta cache — entries carry the transportUrl that supplied them (_src)
   so they can be pruned when that add-on is removed */
const metaCache=Object.create(null);
DEMO.forEach(m=>{m._src="atrium://demo/manifest.json";metaCache[m.id]=m;});
const cacheMeta=(m,src)=>{
  if(!m||!m.id) return m;
  if(src) m._src=src;
  const prev=metaCache[m.id];
  if(prev&&!m._src&&prev._src) m._src=prev._src;
  metaCache[m.id]=m;return m;
};
const cachedMeta=id=>metaCache[String(id).split(":")[0]]||null;
/* keep anything the user put in their library — it still has to render there */
function pruneMetaCache(transportUrl){
  Object.keys(metaCache).forEach(id=>{
    if(metaCache[id]._src===transportUrl && !model.ctx.library.items[id]) delete metaCache[id];
  });
}

/* catalog cache — stale-while-revalidate, persisted between launches */
const CATALOG_TTL=15*60*1000, CATALOG_MAX=24;
const catalogCache=new Map(Object.entries(Env.getStorage("catalogCache",{})));
const ckey=(d,type,id,extra)=>
  `${d.transportUrl}|${type}|${id}|${(extra||[]).map(e=>e.join("=")).join("&")}`;
function catalogCachePersist(){
  const obj={};
  [...catalogCache.entries()]
    .sort((a,b)=>b[1].t-a[1].t).slice(0,CATALOG_MAX)
    .forEach(([k,v])=>obj[k]=v);
  Env.setStorage("catalogCache",obj);
}
function catalogCacheDrop(transportUrl){
  [...catalogCache.keys()].forEach(k=>{ if(k.startsWith(transportUrl+"|")) catalogCache.delete(k); });
  catalogCachePersist();
}

/* ================================================================
   RUNTIME
   ================================================================ */
function dispatch(action){
  const [group,name,payload]=action;
  if(group==="Ctx") return ctxUpdate(name,payload);
  if(group==="MetaDetails"){
    if(name==="SelectSeason") model.metaDetails.season=payload;
    if(name==="SelectVideo") model.metaDetails.selectedVideoId=payload;
    return;
  }
  if(group==="Player") return playerUpdate(name,payload);
  if(group==="Unload") model.metaDetails={metaItem:null,selectedVideoId:null,season:1,streams:[]};
}
function ctxUpdate(name,p){
  const lib=model.ctx.library.items;
  switch(name){
    case "AddToLibrary": lib[p.id]=Object.assign(libraryItemFrom(p),lib[p.id]||{},{removed:false,temp:false,_mtime:Env.now()}); cacheMeta(p); break;
    case "RemoveFromLibrary": if(lib[p]){lib[p].removed=true;lib[p]._mtime=Env.now();} break;
    case "RewindLibraryItem": if(lib[p]) lib[p].state.timeOffset=0; break;
    case "InstallAddon":
      if(!model.ctx.profile.addons.some(d=>d.transportUrl===p.transportUrl)){
        model.ctx.profile.addons.push(p);
        catalogCacheDrop(p.transportUrl);   /* a reinstall shouldn't serve old rows */
      }
      break;
    case "UninstallAddon":{
      const i=model.ctx.profile.addons.findIndex(d=>d.transportUrl===p.transportUrl);
      if(i>=0){
        model.ctx.profile.addons.splice(i,1);
        catalogCacheDrop(p.transportUrl);
        pruneMetaCache(p.transportUrl);
      }
      break; }
    case "UpdateSettings": Object.assign(model.ctx.profile.settings,p); break;
    case "PushSearchHistory":
      model.ctx.searchHistory.items=[p,...model.ctx.searchHistory.items.filter(x=>x!==p)].slice(0,12); break;
  }
  persist(); refreshContinueWatching();
}
function refreshContinueWatching(){
  model.continueWatchingPreview.libraryItems=Object.values(model.ctx.library.items)
    .filter(i=>!i.removed&&i.state.timeOffset>0&&i.state.timeOffset<i.state.duration*0.92)
    .sort((a,b)=>new Date(b.state.lastWatched||0)-new Date(a.state.lastWatched||0));
}

const FM={
  wantCol:0,cur:null,
  scope(){
    if(!document.getElementById("player").hidden)return document.getElementById("player");
    if(!document.getElementById("sources").hidden)return document.getElementById("sources");
    if(document.body.classList.contains("sidebar-open"))return document.getElementById("sidebar");
    return document.querySelector(".page:not([hidden])");
  },
  items(){
    const s=this.scope();if(!s)return[];
    const own=[...s.querySelectorAll("[data-f]")].filter(e=>e.offsetParent!==null);
    /* the glass top bar is row -1 of whatever page is showing */
    if(s.classList&&s.classList.contains("page")){
      const tb=document.getElementById("topbar");
      if(tb&&!document.body.classList.contains("sidebar-open"))
        return [...tb.querySelectorAll("[data-f]")].filter(e=>e.offsetParent!==null).concat(own);
    }
    return own;
  },
  rows(){const m=new Map();this.items().forEach(e=>{const r=+e.dataset.row;
    if(!m.has(r))m.set(r,[]);m.get(r).push(e)});
    [...m.values()].forEach(a=>a.sort((x,y)=>(+x.dataset.col)-(+y.dataset.col)));return m;},
  set(e,scroll=true){
    if(!e)return;
    this.items().forEach(x=>{x.classList.remove("focused");x.classList.remove("lit")});
    e.classList.add("focused");
    if(e.classList.contains("glass"))e.classList.add("lit");
    this.cur=e;
    if(e.dataset.meta&&!document.body.classList.contains("in-detail")){
      const m=cachedMeta(e.dataset.meta); if(m) setBackdrop(m);
    }
    if(!scroll)return;
    const rail=e.closest(".rail-scroll");
    if(rail)rail.scrollTo({left:Math.max(0,e.offsetLeft-rail.clientWidth/2+e.offsetWidth/2),behavior:"smooth"});
    const app=document.getElementById("app");
    if(app.contains(e)){const r=e.getBoundingClientRect(),pad=innerHeight*.22;
      if(r.top<pad)app.scrollBy({top:r.top-pad,behavior:"smooth"});
      else if(r.bottom>innerHeight-pad*.6)app.scrollBy({top:r.bottom-innerHeight+pad*.6,behavior:"smooth"});}
  },
  first(){
    const m=this.rows(),all=[...m.keys()].sort((a,b)=>a-b);
    const k=all.filter(x=>x>=0).length?all.filter(x=>x>=0):all;
    if(k.length){this.set(m.get(k[0])[0]);this.wantCol=0;}},
  move(dir){
    const map=this.rows(),keys=[...map.keys()].sort((a,b)=>a-b);
    if(!keys.length)return;
    if(!this.cur||!this.items().includes(this.cur)){this.first();return;}
    const row=+this.cur.dataset.row,line=map.get(row)||[];
    if(dir==="left"||dir==="right"){
      const j=line.indexOf(this.cur)+(dir==="right"?1:-1);
      if(j<0){if(this.scope().id!=="sidebar"&&document.getElementById("player").hidden
                &&document.getElementById("sources").hidden)openSidebar();return;}
      if(j>=line.length)return;
      this.set(line[j]);this.wantCol=+line[j].dataset.col;return;
    }
    const nk=keys[keys.indexOf(row)+(dir==="down"?1:-1)];
    if(nk===undefined)return;
    const next=map.get(nk);
    this.set(next.reduce((b,e)=>Math.abs(+e.dataset.col-this.wantCol)<Math.abs(+b.dataset.col-this.wantCol)?e:b,next[0]));
  }
};

/* ================================================================
   SPOTLIGHT  —  hero trailer autoplay
   Sources trailers from MetaItem.trailerStreams (Stream[]) or the
   legacy `trailers` array. Bundled demo titles get a procedural
   stand-in so the motion design is visible with no network.
   ================================================================ */
function trailerOf(m){
  if(!m) return null;
  const streams=[...(m.trailerStreams||[]),...(m.trailers||[])];
  for(const s of streams){
    if(s.ytId) return {kind:"yt", id:s.ytId};
    if(s.source && (s.type==="Trailer"||!s.type)) return {kind:"yt", id:s.source};
    if(s.url && /\.(mp4|webm|m3u8)(\?|$)/i.test(s.url)) return {kind:"url", url:s.url};
  }
  if(m._src==="atrium://demo/manifest.json") return {kind:"demo"};
  return null;
}
/* catalog rows carry previews; trailers only live on the full meta */
async function ensureTrailer(m){
  if(!m || m._trailerChecked) return m;
  if((m.trailerStreams&&m.trailerStreams.length)||(m.trailers&&m.trailers.length)
     ||m._src==="atrium://demo/manifest.json"){ m._trailerChecked=true; return m; }
  m._trailerChecked=true;
  try{
    const {meta}=await Addons.meta(m.type,m.id);
    if(meta&&meta.id===m.id){
      m.trailerStreams=meta.trailerStreams||[];
      m.trailers=meta.trailers||[];
      if(!m.background&&meta.background) m.background=meta.background;
    }
  }catch(e){}
  return m;
}

const Spotlight={
  layer:null, meta:null, muted:true, timer:null,
  active(){ return !!this.layer; },
  enabled(){
    const S=model.ctx.profile.settings;

  },

    if(!this.enabled()||view!=="board") return false;

    await ensureTrailer(m);

          + `?autoplay=1&mute=${this.muted?1:0}&controls=0&loop=1&playsinline=1`
          + `&playlist=${encodeURIComponent(t.id)}&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1`;
      layer.appendChild(f);
    }else if(t.kind==="url"){
      const v=el("video");

      v.muted=this.muted; v.controls=false;

    const m=this.meta; this.stop(); if(m) this.play(m);   /* iframes need a reload */
  },
  stop(){
    clearTimeout(this.timer);

    if(!l) return;
    l.classList.remove("on");
    setTimeout(()=>l.remove(),900);
  }
};

const SPOTLIGHT_MAX=32000;   /* how long a trailer holds the hero */
function heroPaused(){
  return view!=="board" || document.body.classList.contains("sidebar-open")
      || !document.getElementById("player").hidden
      || !document.getElementById("sources").hidden;
}
function startHero(){ scheduleHero(); }
function scheduleHero(){
  clearTimeout(heroTimer);
  const S=model.ctx.profile.settings;
  const dwell=Math.max(2,+S.spotlightDelay||4)*1000;
  heroTimer=setTimeout(async ()=>{
    if(heroPaused()) return scheduleHero();
    const m=heroPool[heroIdx];
    const played=Spotlight.enabled() ? await Spotlight.play(m) : false;
    clearTimeout(heroTimer);
    heroTimer=setTimeout(()=>{
      Spotlight.stop();
      if(heroPaused()) return scheduleHero();
      /* sitting on the hero holds the slide, same as tvOS */
      if(FM.cur&&FM.cur.closest("#hero")) return scheduleHero();
      advanceHero();
    }, played ? SPOTLIGHT_MAX : 6000);
  }, dwell);
}
function advanceHero(){
  if(!heroPool.length) return;
  Spotlight.stop();
  renderHero((heroIdx+1)%heroPool.length);
  scheduleHero();
}
function toggleLibrary(m){dispatch(inLibrary(m.id)?["Ctx","RemoveFromLibrary",m.id]:["Ctx","AddToLibrary",m])}
async function openDetailThenPlay(m,resumeV,offset){
  if(m.type==="series"&&!resumeV&&!(m.videos||[]).length){ await openDetail(m.type,m.id); return; }
  playVideo(m,resumeV||(m.type==="series"?videosOf(m)[0]:null),offset);
}

let pendingTime=0;
function playVideo(m,video,timeOffset){pendingTime=timeOffset||0;openStreamPicker(m,video,false)}
async function openStreamPicker(m,video,force){
  Spotlight.stop();
  const vid=video?video.id:m.id;
  const ov=document.getElementById("sources");
  const sheet=el("div","sheet glass");
  sheet.innerHTML=`<h2>Finding sources</h2><div class="sub">${esc(m.name)}${video?` · S${video.season} E${video.episode}`:""}</div>`;
  for(let i=0;i<3;i++){const s=el("div","src glass");s.appendChild(el("div","skel skel-line"));sheet.appendChild(s)}
  ov.innerHTML="";ov.appendChild(sheet);ov.hidden=false;

  const {streams,failed}=await Addons.streams(m.type,vid);
  const playable=[],unsupported=[];
  streams.forEach(s=>{ (streamSource(s).playable?playable:unsupported).push(s); });
  const items=applyStreamPipeline(playable);
  const filteredOut=playable.length-items.reduce((n,i)=>n+(i.dupes||1),0);

  if(!items.length){
    return errorSheet("No sources found", playable.length
      ? `${playable.length} source${playable.length===1?"":"s"} came back but your filters excluded all of them. Loosen them in Settings › Source preferences.`
      : unsupported.length
        ? `${unsupported.length} source${unsupported.length===1?"":"s"} came back in a format this build doesn't play. It plays direct links, YouTube and external links.`
        : failed.length
          ? `${failed.length} add-on${failed.length===1?"":"s"} couldn't be reached. Check that they're online and allow browser requests.`
          : "No installed add-on returned a playable source. Install a source add-on and try again.");
  }
  if(model.ctx.profile.settings.autoPickStream&&!force){
    ov.hidden=true;ov.innerHTML="";
    return startPlayback(m,video,items[0].s,pendingTime);
  }

  const P=sp();
  const s2=el("div","sheet glass");
  const addonCount=new Set(items.map(i=>i.p.addon&&i.p.addon.manifest.id)).size;
  s2.innerHTML=`<h2>Play with</h2><div class="sub">${esc(m.name)}${video?` · S${video.season} E${video.episode}`:""} — ${items.length} source${items.length===1?"":"s"} from ${addonCount} add-on${addonCount===1?"":"s"}</div>`;
  items.forEach((item,i)=>{
    const p=item.p;
    const b=el("button","src glass");
    b.dataset.f="";b.dataset.row=i;b.dataset.col=0;
    const nameLine=formatStream(item,P.nameTemplate)||"Source";
    const descLine=formatStream(item,P.descTemplate)||streamSource(item.s).type;
    const tech=model.ctx.profile.settings.showTechnicalDetails&&p.filename
      ? `<div class="sspec" style="opacity:.55">${esc(p.filename)}</div>`:"";
    b.innerHTML=`<div><div class="sname">${esc(nameLine)}${item.dupes>1?`<span class="dupes">×${item.dupes}</span>`:""}</div>
      <div class="sspec">${esc(descLine)}</div>${tech}</div>
      <div class="sright"><span class="${p.cached?"tagi":"taga"}">${p.cached?"⚡ ":""}${availabilityLabel(p.state)}</span>
      ${p.size?`<div class="ssize">${gb(p.size)}</div>`:""}</div>`;
    b.onclick=()=>{closeSources();startPlayback(m,video,item.s,pendingTime)};
    s2.appendChild(b);
  });
  const notes=[];
  if(filteredOut>0) notes.push(`${filteredOut} filtered out by your preferences.`);
  if(unsupported.length) notes.push(`${unsupported.length} in an unsupported format.`);
  failed.forEach(f=>notes.push(`${f.addon.manifest.name}: ${f.error.message||"unavailable"}`));
  if(notes.length) s2.appendChild(el("div","sheet-note",esc(notes.join(" "))));
  ov.innerHTML="";ov.appendChild(s2);ov.hidden=false;FM.cur=null;FM.first();
}
function closeSources(){const o=document.getElementById("sources");o.hidden=true;o.innerHTML="";FM.cur=null;FM.first()}
function errorSheet(t,body){
  const ov=document.getElementById("sources"),sheet=el("div","sheet glass");
  sheet.innerHTML=`<h2>${esc(t)}</h2><div class="sub">${esc(body)}</div>`;
  const b=el("button","src glass",`<div class="sname">Back</div>`);
  b.dataset.f="";b.dataset.row=0;b.dataset.col=0;b.onclick=closeSources;
  sheet.appendChild(b);ov.innerHTML="";ov.appendChild(sheet);ov.hidden=false;FM.cur=null;FM.first();
}

let plTimer=null,hideTimer=null,upnextShown=false;
function startPlayback(m,video,stream,timeOffset){
  Spotlight.stop();
  const src=streamSource(stream);
  if(src.external){ window.open(src.url,"_blank","noopener"); return; }
  const durMs=((video?38+((video.season*7+video.episode*11)%22):runtimeMins(m))||100)*60000;
  model.player={selected:{stream,videoId:video?video.id:m.id},metaItem:m,video,stream,
    timeOffset:timeOffset||0,duration:durMs,paused:false,nextVideo:video?nextVideoOf(m,video):null};
  model.ctx.streams.items[m.id]={videoId:video?video.id:m.id,addon:stream._addon&&stream._addon.transportUrl,mtime:Env.now()};
  if(!libItem(m.id))dispatch(["Ctx","AddToLibrary",m]);
  upnextShown=false;
  document.body.classList.add("playing");
  document.getElementById("player").hidden=false;
  renderPlayer();clearInterval(plTimer);plTimer=setInterval(tick,1000);
  FM.cur=null;FM.first();armHide();
}
function nextVideoOf(m,v){
  const all=videosOf(m),i=all.findIndex(x=>x.id===v.id);
  return i>=0&&i+1<all.length?all[i+1]:null;

function renderPlayer(){

  const c=el("div","pl-center");

    b.dataset.f="";b.dataset.row=0;b.dataset.col=col;b.onclick=fn;c.appendChild(b)};
  mkb("","↺",0,()=>seek(-model.ctx.profile.settings.seekTimeDuration));

    b.onclick=()=>{if(t==="Sources"){exitPlayer(false);openStreamPicker(P.metaItem,P.video,true)}};
    tools.appendChild(b)});
  bot.appendChild(tools);ui.appendChild(bot);
  const un=el("div","upnext glass");un.id="upnext";un.hidden=true;ui.appendChild(un);

function paintPlayer(){
  const P=model.player,pct=P.duration?P.timeOffset/P.duration:0;
  const f=document.getElementById("plfill"),k=document.getElementById("plknob");
  if(f)f.style.width=(pct*100)+"%";if(k)k.style.left=(pct*100)+"%";
  const n=document.getElementById("plnow"),e=document.getElementById("plend");
  if(n)n.textContent=clock(P.timeOffset/1000);if(e)e.textContent=clock(P.duration/1000);
}
function tick(){
  const P=model.player;if(P.paused)return;
  dispatch(["Player","TimeChanged",{time:P.timeOffset+1000,duration:P.duration}]);
  paintPlayer();
  const left=P.duration-P.timeOffset;
  if(P.nextVideo&&model.ctx.profile.settings.bingeWatching&&left<=45000&&left>0&&!upnextShown)showUpNext();
  if(P.timeOffset>=P.duration)exitPlayer(true);
}
function playerUpdate(name,p){
  const P=model.player;
  if(name==="TimeChanged"){P.timeOffset=Math.min(p.duration,p.time);writeLibraryState();}
  if(name==="PausedChanged")P.paused=p;
  if(name==="Ended")exitPlayer(true);
}
function writeLibraryState(){
  const P=model.player,li=libItem(P.metaItem.id);if(!li)return;
  li.state.timeOffset=P.timeOffset;li.state.duration=P.duration;
  li.state.video_id=P.video?P.video.id:null;
  li.state.lastWatched=Env.now();li.state.timeWatched+=1000;li.state.overallTimeWatched+=1000;
  li._mtime=Env.now();
  if(P.timeOffset/P.duration>=0.92){li.state.flaggedWatched=1}
  if(Math.round(P.timeOffset/1000)%5===0){persist();refreshContinueWatching()}
}
function togglePlay(){dispatch(["Player","PausedChanged",!model.player.paused]);
  const b=document.querySelector(".pl-btn.big");if(b)b.textContent=model.player.paused?"▶":"❚❚";showUI()}
function seek(ms){const P=model.player;P.timeOffset=Math.max(0,Math.min(P.duration,P.timeOffset+ms));paintPlayer();showUI()}
function showUpNext(){
  const P=model.player,n=P.nextVideo;if(!n)return;upnextShown=true;
  const un=document.getElementById("upnext");
  un.innerHTML=`<div class="k">Up next</div><div class="t">S${n.season} E${n.episode} · ${esc(n.title||"")}</div>`;
  const b=el("button","btn-white","Play now");
  b.dataset.f="";b.dataset.row=2;b.dataset.col=0;
  b.onclick=()=>startPlayback(P.metaItem,n,P.stream,0);
  un.appendChild(b);un.hidden=false;showUI();
}
function exitPlayer(ended){
  writeLibraryState();persist();refreshContinueWatching();
  clearInterval(plTimer);clearTimeout(hideTimer);
  document.getElementById("player").hidden=true;
  document.body.classList.remove("playing");
  model.player.paused=true;
  if(ended&&model.ctx.profile.settings.bingeWatching&&model.player.nextVideo){
    startPlayback(model.player.metaItem,model.player.nextVideo,model.player.stream,0);return;
  }

let searchType="All",searchQ="",searchSeq=0;
function renderSearch(){
  const p=document.getElementById("page-search");
  p.innerHTML=`<div class="pagehead"><h1>Search</h1></div>`;
  const f=el("div","searchfield glass");f.dataset.f="";f.dataset.row=0;f.dataset.col=0;
  f.innerHTML=`<span>⌕</span><input id="q" placeholder="Movies, shows, people" autocomplete="off">`;
  f.onclick=()=>f.querySelector("input").focus();
  p.appendChild(f);
  const fl=el("div","filters");
  ["All","Movies","TV Shows"].forEach((t,i)=>{
    const c=el("button","chip glass",t);c.dataset.f="";c.dataset.row=1;c.dataset.col=i;
    c.setAttribute("aria-selected",String(t===searchType));
    c.onclick=()=>{searchType=t;renderSearch();
      FM.set(document.querySelector(`#page-search [data-row="1"][data-col="${i}"]`),false)};
    fl.appendChild(c)});
  p.appendChild(fl);
  const res=el("div");res.id="results";p.appendChild(res);
  drawResults();
  const inp=p.querySelector("#q");inp.value=searchQ;
  let t;
  inp.addEventListener("input",e=>{searchQ=e.target.value;clearTimeout(t);t=setTimeout(drawResults,320)});
  inp.addEventListener("change",e=>{if(e.target.value)dispatch(["Ctx","PushSearchHistory",e.target.value])});
}
async function drawResults(){
  const res=document.getElementById("results");if(!res)return;
  const seq=++searchSeq;
  res.innerHTML="";
  if(!searchQ){
    const w=el("div","rails");let row=2;
    const hist=model.ctx.searchHistory.items;
    if(hist.length){
      const hw=el("section","rail");hw.appendChild(el("h2","rail-head","Recent searches"));
      const sc=el("div","rail-scroll");
      hist.forEach((h,i)=>{const c=el("button","chip glass",esc(h));
        c.dataset.f="";c.dataset.row=row;c.dataset.col=i;
        c.onclick=()=>{searchQ=h;renderSearch()};sc.appendChild(c)});
      hw.appendChild(sc);w.appendChild(hw);row++;
    }
    const pool=Object.values(metaCache).slice(0,16);
    if(pool.length) w.appendChild(rail("Suggested",pool.map(m=>({meta:m})),"poster",row++));
    res.appendChild(w);FM.cur||FM.first();return;
  }
  res.appendChild(el("div","empty","Searching…"));

  /* fan out to every installed addon with a search-capable catalog */
  const types = searchType==="Movies"?["movie"]:searchType==="TV Shows"?["series"]:["movie","series"];
  const jobs=[];
  Addons.installed().forEach(d=>{
    (d.manifest.catalogs||[]).forEach(c=>{
      if(!types.includes(c.type)) return;
      const ex=(c.extra||[]).map(e=>e.name).concat(c.extraSupported||[]);
      if(!ex.includes("search")) return;
      jobs.push(Addons.catalog(d,c.type,c.id,[["search",searchQ]]).then(metas=>({d,metas})));
    });
  });
  const out=await Promise.allSettled(jobs);
  if(seq!==searchSeq) return;
  const seen=new Set(),metas=[];
  out.forEach(r=>{ if(r.status!=="fulfilled")return;
    r.value.metas.forEach(m=>{ if(seen.has(m.id))return; seen.add(m.id); cacheMeta(m); metas.push(m); }); });
  res.innerHTML="";
  if(!metas.length){
    res.appendChild(el("div","empty",`<b>Nothing matched “${esc(searchQ)}”</b>${jobs.length?"Try a different title.":"No installed add-on provides a searchable catalog."}`));
    FM.cur=null;FM.first();return;
  }
  const g=el("div","grid");
  metas.forEach((m,i)=>g.appendChild(card(m,shapeClass(m.posterShape),2+Math.floor(i/6),i%6)));
  res.appendChild(g);FM.cur=null;FM.first();
}

let addonBusy=false,addonMsg=null;

/* shared install-by-URL control — used by Add-ons and by Settings */
function installField(row,rerender,placeholder){
  const f=el("div","searchfield glass addon-install");
  f.dataset.f="";f.dataset.row=row;f.dataset.col=0;
  f.innerHTML=`<span>⧉</span><input class="addonurl" placeholder="${esc(placeholder||"Paste an add-on manifest URL")}" autocomplete="off" spellcheck="false">
    <span class="pillbtn addonbtn">${addonBusy?"Adding…":"Add"}</span>`;
  const input=f.querySelector(".addonurl");
  const run=async()=>{
    const v=input.value.trim();
    if(!v||addonBusy)return;
    addonBusy=true;addonMsg=null;
    f.querySelector(".addonbtn").textContent="Adding…";
    try{ const d=await Addons.install(v); addonMsg={ok:true,text:`Installed ${d.manifest.name}.`}; heroPool=[]; }
    catch(e){ addonMsg={ok:false,text:e.message||"Couldn't install that add-on."}; }
    addonBusy=false;rerender();
  };
  f.onclick=()=>input.focus();
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.stopPropagation();e.preventDefault();run()}});
  f.querySelector(".addonbtn").onclick=e=>{e.stopPropagation();run()};
  return f;
}
function addonMsgNode(){
  return addonMsg ? el("div","empty addon-msg"+(addonMsg.ok?" ok":""),esc(addonMsg.text)) : null;

function setAddonResource(d,res,on){

        .reduce((n,f)=>n+Object.values(P[f]).filter(v=>v===false).length,0);
      sp1.innerHTML=`<span class="lbl">Source preferences<span class="sub">Sort order, filters, duplicates, display format${offCount?` · ${offCount} filtered`:""}</span></span><span class="val">›</span>`;
      sp1.onclick=()=>go("sourceprefs");
      w.appendChild(sp1);
      const sp2=el("button","setrow glass");
      sp2.dataset.f="";sp2.dataset.row=row++;sp2.dataset.col=0;
      const C=cp(), hidden=Object.values(C.hidden).filter(Boolean).length;
      sp2.innerHTML=`<span class="lbl">Catalogs<span class="sub">Order and visibility of Home rails${hidden?` · ${hidden} hidden`:""}</span></span><span class="val">›</span>`;
      sp2.onclick=()=>go("catalogprefs");
      w.appendChild(sp2);
    }
    rows.forEach(([key,lbl,sub,opts])=>{
      const b=el("button","setrow glass");b.dataset.f="";b.dataset.row=row++;b.dataset.col=0;
      const v=model.ctx.profile.settings[key];
      const disp=typeof v==="boolean"?(v?"On":"Off"):(key==="seekTimeDuration"?v/1000+"s":key==="spotlightDelay"?v+"s":key==="subtitlesSize"?v+"%":v);
      b.innerHTML=`<span class="lbl">${lbl}${sub?`<span class="sub">${sub}</span>`:""}</span><span class="val">${disp}</span>`;
      b.onclick=()=>{const i=opts.indexOf(v);
        dispatch(["Ctx","UpdateSettings",{[key]:opts[(i+1)%opts.length]}]);
        renderSettings();
        FM.set(document.querySelector(`#page-settings [data-row="${b.dataset.row}"]`),false)};
      w.appendChild(b);
    });
    p.appendChild(w);
  });
  p.appendChild(el("div","sechead","Storage"));
  const w=el("div","sets"),b=el("button","setrow glass");
  b.dataset.f="";b.dataset.row=row++;b.dataset.col=0;
  const n=Object.keys(model.ctx.library.items).length;
  b.innerHTML=`<span class="lbl">Clear library and watch history<span class="sub">${n} item${n===1?"":"s"} stored on this device</span></span><span class="val">Clear</span>`;
  b.onclick=()=>{model.ctx.library.items={};model.ctx.streams.items={};persist();
    refreshContinueWatching();renderSettings();FM.first()};
  w.appendChild(b);
  const rc=el("button","setrow glass");
  rc.dataset.f="";rc.dataset.row=row++;rc.dataset.col=0;
  const cn=catalogCache.size;
  const newest=cn?Math.max(...[...catalogCache.values()].map(v=>v.t)):0;
  const age=newest?Math.round((Date.now()-newest)/60000):0;
  rc.innerHTML=`<span class="lbl">Refresh catalogs<span class="sub">${cn?`${cn} cached · newest ${age} min old`:"Nothing cached yet"}</span></span><span class="val">Refresh</span>`;
  rc.onclick=()=>{catalogCache.clear();catalogCachePersist();heroPool=[];renderSettings();FM.first()};
  w.appendChild(rc);
  p.appendChild(w);

  p.appendChild(el("div","sechead","About"));
  const dw=el("div","sets");
  const sandboxed = location.hostname.endsWith("claude.ai") || location.ancestorOrigins?.length>0
                 || window.top!==window.self;
  const diag=el("div","empty addon-hint");
  diag.innerHTML = sandboxed
    ? `<b>Running sandboxed</b>This page is embedded in another site, so its content-security policy blocks requests to other domains. Add-on installs will fail here no matter how the add-on is configured. Save <code>index.html</code> and serve it locally — <code>python3 -m http.server</code>, then open <code>localhost:8000</code> — and add-ons work normally. Serve it rather than opening the file directly: a <code>file://</code> page has a null origin that most add-on servers reject.`
    : `<b>Running standalone</b>Add-on requests go straight from this page to the add-on. If one fails, the add-on either isn't sending <code>Access-Control-Allow-Origin</code> or isn't reachable. Check with <code>curl -i &lt;manifest URL&gt;</code>.`;
  p.appendChild(diag);
  const pr=el("button","setrow glass");
  pr.dataset.f="";pr.dataset.row=row++;pr.dataset.col=0;
  pr.innerHTML=`<span class="lbl">Origin<span class="sub">${esc(location.origin)}</span></span><span class="val">${sandboxed?"Sandboxed":"Direct"}</span>`;
  pr.onclick=()=>{};
  dw.appendChild(pr);
  p.appendChild(dw);
  FM.cur=null;FM.first();
}

/* ================================================================
   ROUTER
   ================================================================ */
const PAGE={board:"page-board",metaDetails:"page-metaDetails",search:"page-search",
  discover:"page-discover",sports:"page-sports",library:"page-library",
  addons:"page-addons",settings:"page-settings",
  sourceprefs:"page-sourceprefs",catalogprefs:"page-catalogprefs"};
function show(v){
  view=v;
  const t=PAGE[v]||"page-board";
  document.querySelectorAll(".page").forEach(p=>p.hidden=p.id!==t);
  document.getElementById("app").scrollTo({top:0,behavior:"auto"});
  syncTabs();
}
function go(id){
  Spotlight.stop();
  if(id!=="metaDetails")document.body.classList.remove("in-detail");
  if(id==="movies"){discType="movie";show("discover");view="movies";syncTabs();renderDiscover();location.hash="/discover/movie";}
  else if(id==="shows"){discType="series";show("discover");view="shows";syncTabs();renderDiscover();location.hash="/discover/series";}
  else if(id==="continue"){libTab="Continue Watching";show("library");view="continue";syncTabs();renderLibrary();location.hash="/continuewatching";}
  else{
    show(id);
    ({board:renderBoard,search:renderSearch,discover:renderDiscover,sports:renderSports,
      library:renderLibrary,addons:renderAddons,settings:renderSettings,
      sourceprefs:renderSourcePrefs,catalogprefs:renderCatalogPrefs}[id]||(()=>{}))();
    location.hash="/"+(id==="board"?"board":id);
  }
  FM.cur=null;FM.first();
}
function back(){
  if(!document.getElementById("player").hidden){exitPlayer(false);return}
  if(!document.getElementById("sources").hidden){closeSources();return}
  if(document.body.classList.contains("sidebar-open")){closeSidebar();return}
  if(view==="metaDetails"){dispatch(["Unload"]);document.body.classList.remove("in-detail");go("board");return}
  if(view!=="board"){go("board");return}
  openSidebar();
}

/* ================================================================
   INPUT
   ================================================================ */
const KEYS={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
document.addEventListener("keydown",e=>{
  if(document.activeElement&&document.activeElement.tagName==="INPUT"){
    if(e.key==="Escape"||e.key==="ArrowDown")document.activeElement.blur();
    else if(e.key!=="ArrowUp")return;
  }
  if(!document.getElementById("player").hidden)showUI();
  const d=KEYS[e.key];
  if(d){e.preventDefault();FM.move(d);return}
  if(e.key==="Enter"||e.key===" "){e.preventDefault();
    if(FM.cur)FM.cur.click();else if(!document.getElementById("player").hidden)togglePlay();return}
  if(e.key==="Escape"||e.key==="Backspace"||e.key==="GoBack"){e.preventDefault();back();return}
  if(e.key==="m"||e.key==="ContextMenu"){e.preventDefault();openSidebar()}
});
document.addEventListener("pointerover",e=>{
  const t=e.target.closest("[data-f]");
  if(t&&t!==FM.cur&&FM.items().includes(t))FM.set(t,false);
});
document.getElementById("player").addEventListener("pointermove",showUI);
document.getElementById("dim").addEventListener("click",closeSidebar);

/* ================================================================
   BOOT
   ================================================================ */
(function boot(){
  if(!Object.keys(model.ctx.library.items).length){
    const s=DEMO[0],v=videosOf(s)[9];
    dispatch(["Ctx","AddToLibrary",s]);
    Object.assign(model.ctx.library.items[s.id].state,
      {timeOffset:14*60000,duration:41*60000,video_id:v.id,lastWatched:Env.now(),timeWatched:14*60000});
    const f=DEMO[3];
    dispatch(["Ctx","AddToLibrary",f]);
    Object.assign(model.ctx.library.items[f.id].state,
      {timeOffset:52*60000,duration:141*60000,lastWatched:new Date(Date.now()-864e5).toISOString()});
    persist();
  }
  refreshContinueWatching();
  buildTabs();
  buildSidebar();
  Addons.refreshManifests();   /* background; corrects bundled manifests */
  const h=location.hash.slice(1).split("/").filter(Boolean);
  if(h[0]==="detail"&&h[1]&&h[2]){show("metaDetails");openDetail(h[1],h[2],h[3]);}
  else go("board");
})();
</script>
