plugins {
    id "com.android.application"
}

android {
    namespace "com.nolanabbott.nocturne"
    compileSdk 35

    defaultConfig {
        applicationId "com.nolanabbott.nocturne"
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName "3.3.0-native-pages"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
